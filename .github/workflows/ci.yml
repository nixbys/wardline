name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.3
      - run: ruff check src tests

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: wardline
          POSTGRES_PASSWORD: wardline
          POSTGRES_DB: wardline
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wardline -d wardline"
          --health-interval 5s --health-timeout 5s --health-retries 10
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/wardline-dev-password
        ports: ["7687:7687", "7474:7474"]
        options: >-
          --health-cmd "wget -q --spider http://localhost:7474 || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 10
      opensearch:
        image: opensearchproject/opensearch:2
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
        ports: ["9200:9200"]
        options: >-
          --health-cmd "curl -sf http://localhost:9200 || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 15
      kafka:
        # KRaft mode (no ZooKeeper) single-node broker -- the official image's
        # default command works from plain env vars, so (unlike Keycloak) this
        # is a normal `services:` container.
        image: apache/kafka:3.9.0
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          # Default is 3, which a single broker can never satisfy -- every
          # consumer-group operation fails with COORDINATOR_NOT_AVAILABLE
          # forever (silently) without this.
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          CLUSTER_ID: wardline-ci-cluster-id
        ports: ["9092:9092"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr poppler-utils
      - name: Install package
        run: pip install -e ".[dev]" && python -m spacy download en_core_web_sm
      - name: Run migrations
        env:
          POSTGRES_HOST: localhost
          POSTGRES_USER: wardline
          POSTGRES_PASSWORD: wardline
          POSTGRES_DB: wardline
        run: alembic upgrade head
      - name: Start Keycloak (live IdP for the OIDC integration test)
        # Not a `services:` container: the official image needs a `start-dev`
        # command argument, which that block has no way to pass.
        run: |
          docker run -d --name keycloak -p 8090:8080 \
            -e KEYCLOAK_ADMIN=admin -e KEYCLOAK_ADMIN_PASSWORD=admin \
            -e KC_PROXY_HEADERS=xforwarded \
            quay.io/keycloak/keycloak:26.7.1 start-dev --http-port=8080
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8090/realms/master || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
      - name: Run tests
        env:
          POSTGRES_HOST: localhost
          POSTGRES_USER: wardline
          POSTGRES_PASSWORD: wardline
          POSTGRES_DB: wardline
          NEO4J_URI: bolt://localhost:7687
          NEO4J_PASSWORD: wardline-dev-password
          API_KEY_PEPPER: ci-test-pepper-not-for-production
          KEYCLOAK_BASE_URL: http://localhost:8090
          OPENSEARCH_URL: http://localhost:9200
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
        run: pytest tests/unit tests/integration -v

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - name: Build api image
        run: docker build -f docker/Dockerfile.api -t wardline-api:ci .
      - name: Build worker image
        run: docker build -f docker/Dockerfile.worker -t wardline-worker:ci .
