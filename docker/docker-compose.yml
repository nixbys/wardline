# `:Z` on bind-mounted config files (below) relabels them for exclusive
# container access under SELinux (enforcing by default on Fedora/RHEL
# hosts) — without it, the container gets a bare permission-denied trying
# to read a file that's perfectly readable on the host, since the file
# still carries a host-only SELinux context otherwise.
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wardline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wardline}
      POSTGRES_DB: ${POSTGRES_DB:-wardline}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro,Z
    # Bound to localhost only: this port doesn't need to be reachable from
    # the network on a real deployment host, only from other containers on
    # the compose network (which this binding doesn't affect) and from the
    # host machine itself for local psql/debugging.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wardline} -d ${POSTGRES_DB:-wardline}"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 1g
    cpus: 1.0

  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-wardline-dev-password}
      NEO4J_PLUGINS: '[]'
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    # See postgres comment above re: localhost-only binding.
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 2g
    cpus: 1.5

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-wardline}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-wardline-dev-secret}
    volumes:
      - minio_data:/data
    # See postgres comment above re: localhost-only binding.
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    cpus: 0.5

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-wardline} ${S3_SECRET_KEY:-wardline-dev-secret} &&
      mc mb -p local/${S3_BUCKET:-wardline-bronze} || true
      "

  migrator:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    env_file: ../.env
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["alembic", "upgrade", "head"]

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    env_file: ../.env
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    # Published directly for local dev continuity (see README). In a real
    # deployment, remove this and rely on the `caddy` service below as the
    # only public entry point (TLS-terminated), reaching `api` only over
    # the internal compose network.
    ports:
      - "8000:8000"
    mem_limit: 2g
    cpus: 2.0

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    restart: unless-stopped
    env_file: ../.env
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    mem_limit: 2g
    cpus: 2.0

  # TLS-terminating reverse proxy. Without DOMAIN set, Caddy serves HTTPS on
  # :443 using its own locally-trusted CA (fine for local testing — clients
  # need to trust or bypass that cert). Set DOMAIN to a real hostname
  # pointed at this host and Caddy automatically provisions and renews a
  # real Let's Encrypt certificate — no other config changes needed.
  #
  # Defaults to 8080/8443 on the host: rootless Podman/Docker can't bind
  # <1024 without a host-level capability grant this repo won't make for
  # you. A typical root-daemon Docker host can set HTTP_PORT=80/HTTPS_PORT=443
  # in .env instead.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,Z
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    depends_on:
      - api
    mem_limit: 256m
    cpus: 0.5

  # Optional trace sink: unset OTEL_EXPORTER_OTLP_ENDPOINT (default) and
  # traces just print to console — this service isn't required for that.
  # Set OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317 in .env to
  # route through it, and edit docker/otel-collector-config.yaml to add a
  # real backend exporter (Honeycomb, Grafana Cloud, Datadog, etc).
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro,Z
    ports:
      - "127.0.0.1:4317:4317"
    mem_limit: 256m
    cpus: 0.5

  # Optional local IdP for exercising AUTH_MODE=oidc (api/oidc_auth.py)
  # without a real Okta/Auth0/Entra ID tenant. Not started by default --
  # `docker compose --profile oidc up keycloak`, then create a realm/client
  # and point OIDC_ISSUER/OIDC_JWKS_URL at it (http://localhost:8090/realms/<realm>).
  # This is also how tests/integration/test_oidc_live.py exercises the real
  # thing in CI (see .github/workflows/ci.yml).
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.1
    profiles: ["oidc"]
    restart: unless-stopped
    command: ["start-dev", "--http-port=8080"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_PROXY_HEADERS: xforwarded
    ports:
      - "127.0.0.1:8090:8080"
    mem_limit: 512m
    cpus: 0.5

  # Optional real BM25 lexical backend (retrieval/opensearch_backend.py),
  # the noted upgrade path from Postgres tsvector's BM25-*like* ranking.
  # Not started by default -- `docker compose --profile opensearch up
  # opensearch`, then set LEXICAL_BACKEND=opensearch in .env. This is also
  # how tests/integration/test_opensearch_backend.py exercises the real
  # thing in CI.
  opensearch:
    image: opensearchproject/opensearch:2
    profiles: ["opensearch"]
    restart: unless-stopped
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:9200:9200"
    mem_limit: 1g
    cpus: 1.0

  # Optional real Kafka job dispatch (worker/kafka_queue.py), the noted
  # upgrade path from the Postgres SKIP LOCKED queue. Not started by
  # default -- `docker compose --profile kafka up kafka`, then set
  # JOB_QUEUE_BACKEND=kafka in .env. This is also how
  # tests/integration/test_kafka_queue.py exercises the real thing in CI.
  # KRaft mode (no ZooKeeper), single-node.
  kafka:
    image: apache/kafka:3.9.0
    profiles: ["kafka"]
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Default is 3, which a single broker can never satisfy -- every
      # consumer-group operation fails with COORDINATOR_NOT_AVAILABLE
      # forever (silently) without this.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: wardline-dev-cluster-id
    ports:
      - "127.0.0.1:9092:9092"
    mem_limit: 1g
    cpus: 1.0

  # Optional active-scan sidecar (toolrunner/), the execution backend for
  # wardline.connectors.nmap_scan. Not started by default -- `docker compose
  # --profile toolrunner up toolrunner`, then set TOOLRUNNER_URL=
  # http://toolrunner:8090 and a real TOOLRUNNER_TOKEN in .env. Every
  # request this service accepts still had to already clear
  # governance.pep.enforce_engagement_scope upstream in the api container --
  # this sidecar exists only to isolate the scanning *capability* (nmap
  # needs socket access this app's other containers should never have), not
  # to re-decide authorization; see toolrunner/app.py's module docstring.
  # No host port published: reachable only from the worker container that
  # actually runs ingestion jobs.
  toolrunner:
    build:
      context: ./toolrunner
    profiles: ["toolrunner"]
    restart: unless-stopped
    environment:
      TOOLRUNNER_TOKEN: ${TOOLRUNNER_TOKEN:?set a real TOOLRUNNER_TOKEN in .env before enabling this profile}
    mem_limit: 256m
    cpus: 0.5

volumes:
  pgdata:
  neo4j_data:
  neo4j_logs:
  minio_data:
  caddy_data:
  caddy_config:
