<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Accept your invite — Wardline</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="assets/css/tokens.css" />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/components.css" />
    <link rel="stylesheet" href="assets/css/auth.css" />
  </head>
  <body>
    <div class="auth-shell">
      <div class="auth-card card card--pad">
        <div class="auth-brand">
          <span class="nav__mark" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
              <path d="M12 2 3 7v10l9 5 9-5V7l-9-5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
            </svg>
          </span>
          Wardline
        </div>
        <h1 style="font-size:1.05rem; text-align:center;">You've been invited</h1>
        <form id="acceptInviteForm" class="auth-form">
          <div class="field">
            <label class="field__label" for="invitePassword">Set a password</label>
            <input class="input" id="invitePassword" type="password" required minlength="10" autocomplete="new-password" />
            <p class="field__hint">At least 10 characters.</p>
          </div>
          <div class="banner banner--danger" id="acceptInviteError" hidden></div>
          <button class="btn btn--primary btn--block" type="submit">Set password &amp; continue</button>
        </form>
        <p class="auth-foot"><a href="login.html">Back to log in</a></p>
      </div>
    </div>
    <script src="assets/js/theme.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth-pages.js"></script>
  </body>
</html>
