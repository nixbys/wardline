<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in — Wardline</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="assets/css/tokens.css" />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/components.css" />
    <link rel="stylesheet" href="assets/css/auth.css" />
  </head>
  <body>
    <div class="auth-shell">
      <div class="auth-card card card--pad">
        <div class="auth-brand">
          <span class="nav__mark" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
              <path d="M12 2 3 7v10l9 5 9-5V7l-9-5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
            </svg>
          </span>
          Wardline
        </div>

        <div class="segmented auth-tabs" role="tablist" aria-label="Sign in or create an account">
          <button class="segmented__option" id="tabLogin" type="button" aria-pressed="true">Log in</button>
          <button class="segmented__option" id="tabSignup" type="button" aria-pressed="false">Sign up</button>
        </div>

        <!-- ============================== Login ============================== -->
        <form id="loginForm" class="auth-form">
          <div class="field">
            <label class="field__label" for="loginEmail">Email</label>
            <input class="input" id="loginEmail" type="email" required autocomplete="email" />
          </div>
          <div class="field">
            <label class="field__label" for="loginPassword">Password</label>
            <input class="input" id="loginPassword" type="password" required autocomplete="current-password" />
          </div>
          <div class="field" id="mfaField" hidden>
            <label class="field__label" for="loginMfaCode">6-digit code (or a recovery code)</label>
            <input class="input" id="loginMfaCode" type="text" inputmode="numeric" autocomplete="one-time-code" />
            <p class="field__hint">Your password checked out — this account also has MFA enabled.</p>
          </div>
          <div class="banner banner--danger" id="loginError" hidden></div>
          <button class="btn btn--primary btn--block" type="submit">Log in</button>
          <p class="auth-foot"><a href="reset-password.html">Forgot your password?</a></p>
        </form>

        <!-- ============================== Signup ============================= -->
        <form id="signupForm" class="auth-form" hidden>
          <div class="field">
            <label class="field__label" for="signupEmail">Email</label>
            <input class="input" id="signupEmail" type="email" required autocomplete="email" />
          </div>
          <div class="field">
            <label class="field__label" for="signupPassword">Password</label>
            <input class="input" id="signupPassword" type="password" required minlength="10" autocomplete="new-password" />
            <p class="field__hint">At least 10 characters.</p>
          </div>
          <div class="banner banner--danger" id="signupError" hidden></div>
          <div class="banner banner--accent" id="signupSuccess" hidden></div>
          <button class="btn btn--primary btn--block" type="submit">Create account</button>
        </form>

        <p class="auth-foot">
          <a href="app.html">Have an API key instead? Skip to the console →</a>
        </p>
      </div>
    </div>

    <div class="toast-stack" id="toastStack" aria-live="polite"></div>

    <script src="assets/js/theme.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth-pages.js"></script>
  </body>
</html>
