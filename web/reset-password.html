<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset your password — Wardline</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="assets/css/tokens.css" />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/components.css" />
    <link rel="stylesheet" href="assets/css/auth.css" />
  </head>
  <body>
    <div class="auth-shell">
      <div class="auth-card card card--pad">
        <div class="auth-brand">
          <span class="nav__mark" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
              <path d="M12 2 3 7v10l9 5 9-5V7l-9-5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
            </svg>
          </span>
          Wardline
        </div>

        <!-- Shown when there's no ?token= in the URL yet -->
        <form id="requestResetForm" class="auth-form">
          <h1 style="font-size:1.05rem; text-align:center;">Reset your password</h1>
          <div class="field">
            <label class="field__label" for="resetEmail">Email</label>
            <input class="input" id="resetEmail" type="email" required autocomplete="email" />
          </div>
          <div class="banner banner--accent" id="requestResetStatus" hidden></div>
          <button class="btn btn--primary btn--block" type="submit">Send reset link</button>
        </form>

        <!-- Shown once a ?token= is present -->
        <form id="setNewPasswordForm" class="auth-form" hidden>
          <h1 style="font-size:1.05rem; text-align:center;">Choose a new password</h1>
          <div class="field">
            <label class="field__label" for="newPassword">New password</label>
            <input class="input" id="newPassword" type="password" required minlength="10" autocomplete="new-password" />
            <p class="field__hint">At least 10 characters. This signs you out everywhere else.</p>
          </div>
          <div class="banner banner--danger" id="setPasswordError" hidden></div>
          <button class="btn btn--primary btn--block" type="submit">Update password</button>
        </form>

        <p class="auth-foot"><a href="login.html">Back to log in</a></p>
      </div>
    </div>
    <script src="assets/js/theme.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth-pages.js"></script>
  </body>
</html>
